version: '3'

# All commands go through this file (see AGENTS.md). `task check` must be green before every commit.

vars:
  STATIC_DIR: '{{.ROOT_DIR}}/frontend/dist/clockopus/browser'
  # Throw-away PostgreSQL for the contract tests (task db:test); test data only.
  TEST_DB_CONTAINER: clockopus-test-db
  TEST_DB_PORT: '55432'
  TEST_DATABASE_URL: postgres://clockopus:clockopus@127.0.0.1:55432/clockopus

tasks:
  check:
    desc: Everything CI checks - formatting, lint, all tests, builds
    cmds:
      - task: backend:check
      - task: frontend:check
      - task: image

  fmt:
    desc: Format backend and frontend code
    cmds:
      - cargo fmt --manifest-path backend/Cargo.toml
      - cd frontend && npx prettier --write "src/**/*.{ts,html,css}"

  backend:check:
    dir: backend
    deps: [db:test]
    env:
      CLOCKOPUS_TEST_DATABASE_URL: '{{.TEST_DATABASE_URL}}'
    cmds:
      - cargo fmt --check
      - cargo clippy --all-targets --locked -- -D warnings
      - cargo test --locked

  db:test:
    desc: Start the PostgreSQL test database in Docker (127.0.0.1:55432) if it is not running
    status:
      - docker exec {{.TEST_DB_CONTAINER}} pg_isready -U clockopus -d clockopus
    cmds:
      - docker rm -f {{.TEST_DB_CONTAINER}} >/dev/null 2>&1 || true
      - >-
        docker run -d --name {{.TEST_DB_CONTAINER}} -p 127.0.0.1:{{.TEST_DB_PORT}}:5432
        -e POSTGRES_USER=clockopus -e POSTGRES_PASSWORD=clockopus -e POSTGRES_DB=clockopus
        --tmpfs /var/lib/postgresql/data postgres:17.7-trixie
      - |
        for i in $(seq 1 30); do
          docker exec {{.TEST_DB_CONTAINER}} pg_isready -U clockopus -d clockopus -h 127.0.0.1 >/dev/null 2>&1 && exit 0
          sleep 1
        done
        echo "test database did not become ready" >&2; exit 1

  db:test:stop:
    desc: Remove the PostgreSQL test database
    cmds:
      - docker rm -f {{.TEST_DB_CONTAINER}}

  dev:keycloak:
    desc: Local Keycloak with the development realm (users anna/anna, ben/ben) on http://localhost:8180
    status:
      - curl -fsS http://localhost:8180/realms/clockopus-dev/.well-known/openid-configuration >/dev/null
    cmds:
      - docker rm -f clockopus-dev-keycloak >/dev/null 2>&1 || true
      - >-
        docker run -d --name clockopus-dev-keycloak -p 127.0.0.1:8180:8080
        -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin
        -v {{.ROOT_DIR}}/deploy/dev/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
        quay.io/keycloak/keycloak:26.4.5 start-dev --import-realm --hostname=http://localhost:8180
      - |
        for i in $(seq 1 90); do
          curl -fsS http://localhost:8180/realms/clockopus-dev/.well-known/openid-configuration >/dev/null 2>&1 && exit 0
          sleep 2
        done
        echo "Keycloak did not start" >&2; exit 1

  dev:keycloak:stop:
    desc: Remove the local Keycloak
    cmds:
      - docker rm -f clockopus-dev-keycloak

  backend:run:oidc:
    desc: Backend with sign-in (local Keycloak) and PostgreSQL (test database) on http://localhost:8080
    dir: backend
    deps: [dev:keycloak, db:test]
    env:
      CLOCKOPUS_AUTH: oidc
      CLOCKOPUS_OIDC_ISSUER: http://localhost:8180/realms/clockopus-dev
      CLOCKOPUS_OIDC_CLIENT_ID: clockopus
      CLOCKOPUS_STORAGE: postgres
      DATABASE_URL: '{{.TEST_DATABASE_URL}}'
      CLOCKOPUS_STATIC_DIR: '{{.STATIC_DIR}}'
      CLOCKOPUS_LISTEN: 127.0.0.1:8080
    cmds:
      - cargo run

  frontend:install:
    dir: frontend
    sources: [package-lock.json]
    cmds:
      - npm ci --no-audit --no-fund

  frontend:check:
    dir: frontend
    deps: [frontend:install]
    cmds:
      - npx prettier --check "src/**/*.{ts,html,css}"
      - npx ng test --watch=false
      - npx ng build

  backend:run:
    desc: Run the backend natively without sign-in, data in ./data, app from the last frontend build
    dir: backend
    env:
      CLOCKOPUS_AUTH: none
      CLOCKOPUS_STORAGE: yaml
      CLOCKOPUS_DATA_DIR: '{{.ROOT_DIR}}/data'
      CLOCKOPUS_STATIC_DIR: '{{.STATIC_DIR}}'
      CLOCKOPUS_LISTEN: 127.0.0.1:8080
    cmds:
      - cargo run

  frontend:run:
    desc: Angular dev server on http://localhost:4200, API proxied to the backend on :8080
    dir: frontend
    deps: [frontend:install]
    cmds:
      - npx ng serve

  image:
    desc: Build the container image clockopus:local
    cmds:
      - docker build -t clockopus:local .

  up:
    desc: Start clockopus with docker compose on http://localhost:8080
    cmds:
      - docker compose up --build -d
      - docker compose ps
