<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">clockopus</title>
  <!-- Paused clock, held up on the left -->
  <g>
    <path d="M96 142 C 62 146, 40 128, 40 96" fill="none" stroke="#6D5BD0" stroke-width="15" stroke-linecap="round"/>
    <circle cx="40" cy="72" r="20" fill="#B9B4CF"/>
    <circle cx="40" cy="72" r="14" fill="#FFFFFF"/>
    <rect x="34" y="65" width="4" height="14" rx="2" fill="#8A84A8"/>
    <rect x="42" y="65" width="4" height="14" rx="2" fill="#8A84A8"/>
    <path d="M30 98 C 34 92, 46 92, 50 98" fill="none" stroke="#6D5BD0" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- Lower tentacles -->
  <g fill="none" stroke="#6D5BD0" stroke-width="15" stroke-linecap="round">
    <path d="M104 150 C 96 186, 66 192, 70 222 C 72 234, 86 234, 88 226"/>
    <path d="M120 156 C 118 194, 104 210, 112 232"/>
    <path d="M136 156 C 138 194, 152 210, 144 232"/>
    <path d="M152 150 C 160 186, 190 192, 186 222 C 184 234, 170 234, 168 226"/>
  </g>
  <!-- Body -->
  <ellipse cx="128" cy="144" rx="44" ry="18" fill="#6D5BD0"/>
  <path d="M70 110 C 70 62, 96 40, 128 40 C 160 40, 186 62, 186 110 C 186 138, 160 156, 128 156 C 96 156, 70 138, 70 110 Z" fill="#7B6AE0"/>
  <path d="M92 66 C 100 54, 112 49, 124 48" fill="none" stroke="#A497F0" stroke-width="7" stroke-linecap="round"/>
  <!-- Face -->
  <ellipse cx="106" cy="112" rx="13" ry="14" fill="#FFFFFF"/>
  <ellipse cx="150" cy="112" rx="13" ry="14" fill="#FFFFFF"/>
  <circle cx="110" cy="108" r="6.5" fill="#1F1B33"/>
  <circle cx="154" cy="108" r="6.5" fill="#1F1B33"/>
  <circle cx="112" cy="106" r="2" fill="#FFFFFF"/>
  <circle cx="156" cy="106" r="2" fill="#FFFFFF"/>
  <ellipse cx="92" cy="132" rx="8" ry="5" fill="#F29BC1" opacity="0.8"/>
  <ellipse cx="164" cy="132" rx="8" ry="5" fill="#F29BC1" opacity="0.8"/>
  <path d="M118 134 C 124 140, 132 140, 138 134" fill="none" stroke="#1F1B33" stroke-width="4" stroke-linecap="round"/>
  <!-- Running stopwatch, held up on the right -->
  <g>
    <path d="M160 142 C 196 146, 214 124, 206 94" fill="none" stroke="#6D5BD0" stroke-width="15" stroke-linecap="round"/>
    <rect x="195" y="20" width="14" height="10" rx="3" fill="#E5672A"/>
    <rect x="223" y="31" width="10" height="8" rx="3" fill="#E5672A" transform="rotate(45 228 35)"/>
    <circle cx="202" cy="62" r="30" fill="#FF8A3D"/>
    <circle cx="202" cy="62" r="23" fill="#FFFFFF"/>
    <g stroke="#FFC9A6" stroke-width="3" stroke-linecap="round">
      <path d="M202 43 v5"/><path d="M221 62 h-5"/><path d="M202 81 v-5"/><path d="M183 62 h5"/>
    </g>
    <path d="M202 62 L 214 50" stroke="#1F1B33" stroke-width="4" stroke-linecap="round"/>
    <path d="M202 62 L 202 48" stroke="#E5672A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="202" cy="62" r="4" fill="#1F1B33"/>
    <path d="M190 96 C 196 88, 210 88, 216 96" fill="none" stroke="#6D5BD0" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- Motion marks -->
  <g fill="none" stroke="#FF8A3D" stroke-width="4" stroke-linecap="round">
    <path d="M240 54 C 244 60, 244 66, 240 72"/>
    <path d="M164 40 C 168 34, 174 30, 180 28"/>
  </g>
</svg>
