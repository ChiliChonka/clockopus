{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "clockopus.name" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clockopus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "clockopus.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        {{- with $np.gatewayNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: 8080
{{- if .Values.cnpg.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "clockopus.name" . }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clockopus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ include "clockopus.cnpgName" . }}
  policyTypes: [Ingress]
  ingress:
    # App, the other instances, the operator: PostgreSQL and the instance manager.
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.cnpgOperatorNamespace }}
      ports:
        - port: 5432
        - port: 8000
    {{- with $np.metricsNamespace }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        - port: 9187
    {{- end }}
{{- end }}
{{- end }}
