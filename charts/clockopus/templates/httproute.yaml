{{- /*
  HTTPRoute on a shared Gateway (Gateway API). sectionName is required: without it the route
  would also attach to the HTTP listener and bypass the redirect to HTTPS.
*/ -}}
{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "clockopus.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clockopus.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- range $p := (.Values.httpRoute.parentRefs | default (list .Values.httpRoute.parentRef)) }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ required "httpRoute.parentRef.name is required" $p.name }}
      namespace: {{ required "httpRoute.parentRef.namespace is required" $p.namespace }}
      sectionName: {{ required "httpRoute.parentRef.sectionName is required (otherwise the route bypasses the HTTPS redirect)" $p.sectionName }}
    {{- end }}
  hostnames:
    {{- toYaml (required "httpRoute.hostnames is required" .Values.httpRoute.hostnames) | nindent 4 }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: {{ include "clockopus.name" . }}
          port: 8080
      timeouts:
        request: {{ .Values.httpRoute.timeout }}
{{- end }}
