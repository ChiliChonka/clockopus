[package]
name = "clockopus"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A fast personal time tracker for people who switch context all day"
repository = "https://github.com/ChiliChonka/clockopus"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "fs"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
