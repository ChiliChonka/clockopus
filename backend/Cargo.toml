[package]
name = "clockopus"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A fast personal time tracker for people who switch context all day"
repository = "https://github.com/ChiliChonka/clockopus"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["json"] }
jiff = { version = "1.0.0", features = ["serde", "tzdb-bundle-always"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.1"
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "json", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "fs"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.2", features = ["v7", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
