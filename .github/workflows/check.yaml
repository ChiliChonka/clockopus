name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The contract tests run every storage scenario against PostgreSQL as well.
    services:
      postgres:
        image: postgres:17.7-trixie
        env:
          POSTGRES_USER: clockopus
          POSTGRES_PASSWORD: clockopus
          POSTGRES_DB: clockopus
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U clockopus -d clockopus"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CLOCKOPUS_TEST_DATABASE_URL: postgres://clockopus:clockopus@127.0.0.1:55432/clockopus
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --check "src/**/*.{ts,html,css}"
      - run: npx ng test --watch=false
      - run: npx ng build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: pip install pyyaml
      - run: helm lint charts/clockopus -f charts/clockopus/ci/test-values.yaml
      - run: python3 charts/clockopus/tests/test_chart.py

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t clockopus:ci .
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 127.0.0.1:8080:8080 -e CLOCKOPUS_AUTH=none clockopus:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/v1/config | grep -q '"auth":"none"'
          curl -fsS http://127.0.0.1:8080/ | grep -q '<app-root'
      - if: always()
        run: docker logs smoke || true
