name: release

# Tag v<version> (e.g. v0.1.0) releases image and chart together:
#   ghcr.io/<owner>/clockopus:<version>          (container image, linux/amd64)
#   oci://ghcr.io/<owner>/charts/clockopus <version>  (Helm chart)
# The tag must match Chart.yaml (version and appVersion) and backend/Cargo.toml. Both artifacts
# are signed keyless with cosign (GitHub OIDC identity of this workflow).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # GitHub release
  packages: write   # GHCR
  id-token: write   # cosign keyless

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Versions match the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          chart=$(sed -n 's/^version: *//p' charts/clockopus/Chart.yaml)
          app=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}/\1/p' charts/clockopus/Chart.yaml)
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' backend/Cargo.toml | head -1)
          echo "tag=${version} chart=${chart} appVersion=${app} cargo=${cargo}"
          for v in "$chart" "$app" "$cargo"; do
            test "$v" = "$version" || { echo "::error::version mismatch (tag ${version})"; exit 1; }
          done
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/clockopus" >> "$GITHUB_OUTPUT"
          echo "charts=oci://ghcr.io/${owner}/charts" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@v5
      - name: Chart checks
        run: |
          pip install pyyaml
          helm lint charts/clockopus -f charts/clockopus/ci/test-values.yaml
          python3 charts/clockopus/tests/test_chart.py

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the pushed image
        run: |
          docker run -d --name smoke -p 127.0.0.1:8080:8080 -e CLOCKOPUS_AUTH=none \
            "${{ steps.version.outputs.image }}@${{ steps.build.outputs.digest }}"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/readyz && break; sleep 1; done
          # The image reports the released version.
          test "$(curl -fsS http://127.0.0.1:8080/api/v1/config)" = "{\"version\":\"${{ steps.version.outputs.version }}\",\"auth\":\"none\"}"

      - name: Package and push the chart
        id: chart
        run: |
          helm package charts/clockopus --destination dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          out=$(helm push "dist/clockopus-${{ steps.version.outputs.version }}.tgz" "${{ steps.version.outputs.charts }}" 2>&1)
          echo "$out"
          digest=$(echo "$out" | sed -n 's/^Digest: //p')
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3
      - name: Sign image and chart (keyless)
        run: |
          cosign sign --yes "${{ steps.version.outputs.image }}@${{ steps.build.outputs.digest }}"
          charts="${{ steps.version.outputs.charts }}"
          cosign sign --yes "${charts#oci://}/clockopus@${{ steps.chart.outputs.digest }}"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tgz --verify-tag --generate-notes \
            --title "clockopus ${{ steps.version.outputs.version }}"
